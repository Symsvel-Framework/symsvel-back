name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Configure private package access
        env:
          SYMSVEL_READ_TOKEN: ${{ secrets.SYMSVEL_READ_TOKEN }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::Repository secret SYMSVEL_READ_TOKEN is required to install private Core and Tooling packages."
            exit 1
          fi
          echo "::add-mask::$SYMSVEL_READ_TOKEN"
          composer config --global github-oauth.github.com "$SYMSVEL_READ_TOKEN"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer qa
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
