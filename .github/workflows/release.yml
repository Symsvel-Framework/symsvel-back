name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4 and extensions
        run: |
          php -v
          composer --version
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); } foreach (["ctype", "iconv", "intl", "pdo_sqlite"] as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR, "Missing: $ext\\n"); exit(1); } }'
      - name: Configure private package access
        env:
          SYMSVEL_READ_TOKEN: ${{ secrets.SYMSVEL_READ_TOKEN }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::Repository secret SYMSVEL_READ_TOKEN is required to install private Core and Tooling packages."
            exit 1
          fi
          echo "::add-mask::$SYMSVEL_READ_TOKEN"
          composer config --global github-oauth.github.com "$SYMSVEL_READ_TOKEN"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer qa
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected semantic version tag.');
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.data.ref !== `refs/tags/${tag}`) throw new Error('Tag verification failed.');
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, generate_release_notes: true
            });
