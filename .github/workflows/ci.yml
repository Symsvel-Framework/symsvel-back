name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Avoid spending Actions minutes on obsolete commits of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2
      - name: Lint native setup bootstrap
        run: |
          php -l public/index.php
          php -l src/Setup/StandaloneSetup.php
          php -l tests/Setup/StandaloneSetupTest.php
      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); } foreach (["ctype", "iconv", "intl", "pdo_sqlite"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: $extension\n"); exit(1); } }'
      - name: Configure public GitHub Composer access
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::Repository secret Automatic GITHUB_TOKEN is required to install public Core and Tooling packages."
            exit 1
          fi
          echo "::add-mask::$SYMSVEL_READ_TOKEN"
          composer config --global github-oauth.github.com "$SYMSVEL_READ_TOKEN"
      # Composer manifest validation is already part of `composer qa` below.
      # - name: Validate Composer manifest and lockfile
      #   run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify bundle registration and command
        run: |
          php bin/console lint:container --env=test
          php bin/console list symsvel --env=test
      - run: composer qa
      # Exercise the current Core development contract only in the CI workspace.
      - name: Checkout Core dev for HTTP integration
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-core
          ref: dev
          token: ${{ github.token }}
          path: .symcore-ci
      - name: Test Core dev liveness through real Back routing
        if: github.ref == 'refs/heads/dev'
        run: |
          composer config repositories.symsvel-core-ci '{"type":"path","url":"./.symcore-ci","options":{"symlink":true,"versions":{"symsvel-framework/core":"dev-dev"}}}'
          composer require 'symsvel-framework/core:dev-dev' --with-all-dependencies --no-scripts --no-interaction --no-progress
          php bin/console cache:clear --env=test
          php bin/console debug:router symsvel_core_liveness --env=test
          php vendor/bin/phpunit tests/Integration/CoreHealthHttpTest.php --display-skipped

