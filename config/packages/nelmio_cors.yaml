nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(SYMSVEL_CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        max_age: 3600
        allow_credentials: false
    paths:
        '^/api(?:/|$)': ~
        # Only the BO browser refresh transport may receive cross-origin cookies.
        # The Auth controller independently validates the exact HTTPS BO Origin.
        '^/apibo/auth/browser(?:/|$)':
            allow_methods: ['POST', 'OPTIONS']
            allow_headers: ['Content-Type']
            allow_credentials: true
            max_age: 600
        '^/apibo(?:/|$)': ~
        '^/apiopen(?:/|$)': ~
