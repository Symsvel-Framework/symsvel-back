# Symfony Mailer named transports. Selecting one in Settings does not
# install/start a server or verify it is reachable. The developer owns
# local services and their credentials.
framework:
    mailer:
        transports:
            smtp: '%env(MAILER_DSN)%'
            mailpit: 'smtp://127.0.0.1:1025'
            mailhog: 'smtp://127.0.0.1:1025'
            smtp4dev: 'smtp://127.0.0.1:25'
            mailtrap: '%env(MAILTRAP_DSN)%'
