app.swagger:
    path: /api/doc.json
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger, area: default }

app.swagger_ui:
    path: /api/doc
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui, area: default }

app.apibo_swagger:
    path: /apibo/doc.json
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger, area: apibo }

app.apibo_swagger_ui:
    path: /apibo/doc
    methods: [GET]
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui, area: apibo }
